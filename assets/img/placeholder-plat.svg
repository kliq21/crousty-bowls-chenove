<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-label="Photo à venir">
  <defs>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="18" height="18" patternTransform="rotate(45)">
      <rect width="18" height="18" fill="#0A0A0F"/>
      <line x1="0" y1="0" x2="0" y2="18" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="900" height="620" fill="url(#hatch)"/>
  <g transform="translate(450 280)">
    <g transform="rotate(-4)">
      <rect x="-140" y="-30" width="280" height="60" fill="none" stroke="#E63946" stroke-width="3" rx="4"/>
      <rect x="-140" y="-30" width="280" height="60" fill="none" stroke="#E63946" stroke-opacity="0.25" stroke-width="2" rx="4" transform="translate(0 0)" stroke-dasharray="0"/>
      <text x="0" y="10" text-anchor="middle"
        font-family="Anton, Impact, sans-serif"
        font-size="34"
        fill="#E63946"
        letter-spacing="4"
        text-transform="uppercase">PHOTO BIENTÔT</text>
    </g>
  </g>
  <text x="450" y="370" text-anchor="middle"
    font-family="Manrope, Arial, sans-serif"
    font-size="14"
    fill="#FFFFFF" fill-opacity="0.4"
    letter-spacing="4"
    text-transform="uppercase">Crousty Bowls · Chenôve</text>
</svg>
